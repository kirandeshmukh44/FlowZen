<!DOCTYPE html>
<html lang="en" data-theme="flowzen-dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#09060F" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowZen – AI-Assisted Team Task Management</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('flowzen_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = savedTheme || (systemDark ? 'flowzen-dark' : 'flowzen-dark'); // default dark first paint
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (theme === 'flowzen-dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#09060F';
            if (meta) meta.setAttribute('content', '#09060F');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#FDF3F5';
            if (meta) meta.setAttribute('content', '#FDF3F5');
          }
          if (sessionStorage.getItem('flowzen_preloader_shown') === 'true') {
            document.documentElement.classList.add('preloader-skipped');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      .preloader-skipped #initial-preloader {
        display: none !important;
      }
    </style>
  </head>
  <body class="min-h-screen antialiased font-sans transition-colors duration-300">
    <div id="root">
      <div id="initial-preloader" class="preloader-overlay" role="status" aria-label="Loading FlowZen">
        <div class="preloader-logo-box">
          <div class="preloader-glass-disc"></div>
          <img src="/ring.png" alt="FlowZen Waveform Ring" class="preloader-ring" />
          <div class="preloader-f" aria-hidden="true"></div>
        </div>
        <div class="preloader-title" aria-label="FlowZen">
          <span class="preloader-flow">Flow</span>
          <span class="preloader-zen">Zen</span>
        </div>
        <div class="preloader-progress-track">
          <div class="preloader-progress-fill" style="width: 35%;"></div>
        </div>
        <div class="preloader-status">
          Syncing workspace...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
